name: Build Datura Firewall as Magisk Module (crDroid A11 / SDK 30)
on:
  workflow_dispatch:
    inputs:
      use_custom_signing_key:
        description: "Set 'true' kalau lo mau pakai kunci signing ROM sendiri (bukan AOSP testkeys)"
        required: false
        default: "false"

jobs:
  build-datura-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo lo (buat custom key, kalau ada)
        uses: actions/checkout@v4
        with:
          path: my-repo

      # Fork ini udah bundle app/libs/android.jar & app/libs/libcore.jar (hidden-API stub),
      # jadi gak perlu trik Maven / compile AOSP sama sekali.
      - name: Checkout Datura source (esecoder fork, branch android11-qpr1 = SDK 30)
        uses: actions/checkout@v4
        with:
          repository: esecoder/Datura-Firewall
          ref: android11-qpr1
          path: datura

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 30 + build-tools 30.0.2
        run: sdkmanager "platforms;android-30" "build-tools;30.0.2"

      # jcenter() di build.gradle repo ini udah almarhum (dimatikan 2022+).
      # Tambahin mavenCentral() biar dependency AGP/androidx tetep bisa resolve.
      - name: Patch repositories -> tambah mavenCentral (jcenter udah mati)
        run: |
          cd datura
          sed -i 's/jcenter()/jcenter()\n        mavenCentral()/' build.gradle

      # Ganti platform.jks default (AOSP testkeys) kalau lo punya kunci ROM sendiri.
      # Taruh hasil convert kunci lo di my-repo/keys/platform.jks
      - name: Swap signing key kalau custom key disediakan
        if: ${{ github.event.inputs.use_custom_signing_key == 'true' }}
        run: cp my-repo/keys/platform.jks datura/app/platform.jks

      - name: Build Datura.apk (release, signed platform key)
        run: |
          cd datura
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Locate & rename APK
        run: |
          find datura -name "*.apk"
          mkdir -p output_files
          cp datura/app/build/outputs/apk/release/app-release.apk output_files/Datura.apk

      - name: Assemble Magisk module
        run: |
          mkdir -p magisk_module/system/priv-app/Datura
          mkdir -p magisk_module/system/etc/permissions
          mkdir -p magisk_module/META-INF/com/google/android
          cp output_files/Datura.apk magisk_module/system/priv-app/Datura/Datura.apk
          cp my-repo/datura-magisk/privapp-permissions-org.calyxos.datura.xml \
             magisk_module/system/etc/permissions/privapp-permissions-org.calyxos.datura.xml
          cp my-repo/datura-magisk/module.prop magisk_module/module.prop
          cp my-repo/datura-magisk/update-binary magisk_module/META-INF/com/google/android/update-binary
          cp my-repo/datura-magisk/updater-script magisk_module/META-INF/com/google/android/updater-script
          cd magisk_module
          zip -r9 ../Datura-Magisk-crDroid-A11.zip . -x '.git*'

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: Datura-Magisk-Module-crDroid-A11
          path: Datura-Magisk-crDroid-A11.zip
